name: PowerShell checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester and ScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze PowerShell
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Error

      - name: Run unit tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI
